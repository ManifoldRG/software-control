# Example perturbation configuration

# Global perturbation settings
perturbation:
  enabled: true
  seed: 42  # Default seed for reproducibility

# Task instruction perturbation
instruction:
  enabled: true
  probability: 0.7
  strategies:
    synonym_replacement:
      enabled: true
      probability: 0.3
      max_replacements: 3
    paraphrasing:
      enabled: true
      probability: 0.4
      styles: ["formal", "casual", "technical"]
    context_modification:
      enabled: true
      probability: 0.2
      max_context_changes: 2

# UI visual perturbation
ui_visual:
  enabled: true
  probability: 0.8
  browser_themes:
    enabled: true
    themes: ["dark", "light", "high_contrast", "custom"]
    custom_css_probability: 0.3
  os_themes:
    enabled: true
    themes: ["dark", "light", "high_contrast"]
    application_specific: true
  layout_modifications:
    enabled: true
    probability: 0.5
    max_changes: 5

# Visual distractor perturbation
distractor:
  enabled: true
  probability: 0.6
  types:
    popup_windows:
      enabled: true
      probability: 0.4
      max_popups: 2
    notification_overlays:
      enabled: true
      probability: 0.3
      max_notifications: 3
    irrelevant_buttons:
      enabled: true
      probability: 0.5
      max_buttons: 4
    background_applications:
      enabled: true
      probability: 0.2
      max_apps: 1

# Execution settings
execution:
  timeout: 30.0
  max_retries: 3
  parallel_execution: false
  executor_priorities:
    system: 1
    browser: 2
    container: 3
    config: 4

# Logging
logging:
  level: "INFO"
  perturbation_events: true
  execution_details: true
  performance_metrics: true
