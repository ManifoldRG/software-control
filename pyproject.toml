[project]
name = "software-control"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "playwright>=1.54.0",
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

